<!--
  Static form definitions for Netlify form detection.
  Netlify scans this file at build time to register the "quote" and "contact"
  forms. The actual interactive forms live in /quote and /contact and post the
  same field names. This file is not linked from the UI.
-->
<form name="quote" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="quote" />
  <input name="bot-field" />
  <input name="name" />
  <input name="businessName" />
  <input name="email" />
  <input name="phone" />
  <input name="state" />
  <input name="serviceType" />
  <input name="yearsInBusiness" />
  <input name="message" />
  <input name="address" />
  <input name="city" />
  <input name="zip" />
  <input name="priorGrossSales" />
  <input name="priorSubcontractorExpenses" />
  <input name="priorEmployeeCount" />
  <input name="priorEmployeePayroll" />
  <input name="estGrossSales" />
  <input name="estSubcontractorExpenses" />
  <input name="estEmployeeCount" />
  <input name="estEmployeePayroll" />
  <input name="estMaterialCosts" />
  <input name="subsHaveInsurance" />
  <input name="subsInsuredPercent" />
  <input name="needUninsuredSubCoverage" />
  <input name="coverage_types" />
  <input name="year_business_started" />
  <input name="business_description" />
  <input name="class_code_1" />
  <input name="class_code_2" />
  <input name="class_code_3" />
  <input name="class_code_4" />
  <input name="class_code_5" />
  <input name="residential_vs_commercial" />
  <input name="new_vs_existing_construction" />
  <input name="largest_projects" />
  <input name="prior_carrier_name" />
  <input name="prior_policy_number" />
  <input name="prior_policy_expiration" />
</form>

<form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="contact" />
  <input type="text" name="name" />
  <input type="email" name="email" />
  <input type="tel" name="phone" />
  <input type="text" name="subject" />
  <textarea name="message"></textarea>
  <input name="bot-field" type="text" />
</form>
